# Attribution: This recipe is based on https://github.com/openrewrite/rewrite-spring,
# with the exception of removing the transitived org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5 and
# earlier migrations to minimize the changset for users already on Spring Boot 3.5.x. jEAP apps are expected to already
# be on Spring Boot 3.5.x, and the jEAP Spring Boot 4.0 migration guide only documents changes since 3.5.

---
type: specs.openrewrite.org/v1beta/recipe
name: ch.admin.bit.jeap.openrewrite.recipe.UpgradeSpringBoot_4_0_NoOtherMigrations
displayName: Migrate jEAP App to Spring Boot 4.0
description: 'Upgrade jEAP App to Spring Boot 4.0'
tags:
  - spring
  - boot
  - jeap
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.spring.cloud2025.UpgradeSpringCloud_2025_1
  # Spring Cloud BOM is already managed by the jEAP Spring Boot 4 parent.
  - ch.admin.bit.jeap.openrewrite.recipe.maven.RemoveSpringCloudDependenciesBomImport
  - org.openrewrite.java.spring.framework.UpgradeSpringFramework_7_0
  - org.openrewrite.java.spring.security7.UpgradeSpringSecurity_7_0
  - ch.admin.bit.jeap.openrewrite.recipe.security.MigrateAntPathRequestMatcher
  # JUnit 4 Assert can remain unresolved after the parent upgrade; migrate the explicit assertTrue import.
  - ch.admin.bit.jeap.openrewrite.recipe.testing.MigrateJUnit4AssertTrue
  # Spring Framework 7 can expose MediaType ambiguities when Spring HTTP is imported with a wildcard.
  - ch.admin.bit.jeap.openrewrite.recipe.boot.EnsureExplicitSpringHttpMediaTypeImport
  # Spring Boot 4: package moves for web server types — uses text-based import matching
  # because the old types are removed from the classpath and ChangeType (type-resolution based)
  # would silently skip them.
  - ch.admin.bit.jeap.openrewrite.recipe.boot.MigrateSpringBoot4PackageMoves
  # Spring Boot 4: Jackson2ObjectMapperBuilderCustomizer was removed in favour of
  # JsonMapperBuilderCustomizer (org.springframework.boot.jackson.autoconfigure).
  # Also migrates builder.postConfigurer(x -> x.registerModule(y)) → builder.addModule(y).
  - ch.admin.bit.jeap.openrewrite.recipe.boot.MigrateJackson2ObjectMapperBuilderCustomizer
  # Kafka 4: DescribeTopicsResult.all() renamed to allTopicNames() — text-based import matching
  # because compilation fails before the recipe runs.
  - ch.admin.bit.jeap.openrewrite.recipe.kafka.MigrateKafka4DescribeTopics
  # Jackson 3: mapping null to primitive types in @JsonCreator constructors now throws by default.
  # Widens @JsonProperty-annotated primitive params to boxed types (int→Integer, boolean→Boolean, etc.)
  - ch.admin.bit.jeap.openrewrite.recipe.jackson.MigrateJackson3JsonCreatorPrimitivesToBoxed
  # Jackson 3: fix class/import name collision when project defines class JsonMapper and
  # tools.jackson.databind.json.JsonMapper is imported for builder() calls.
  - ch.admin.bit.jeap.openrewrite.recipe.jackson.FixJackson3JsonMapperNameCollision
  # Jackson 3: NumberDeserializers.NumberDeserializer usage no longer resolves.
  # NumberDeserializers moved from deser.std to deser.jdk.
  - ch.admin.bit.jeap.openrewrite.recipe.jackson.MigrateJackson3NumberDeserializersUsage
  # Jackson 3: Normalize Jackson APIs after migration.
  - ch.admin.bit.jeap.openrewrite.recipe.jackson.NormalizeJacksonNodeApis
  # Jackson 3: Restore Jackson 2 default behavior for null-to-primitive deserialization
  - ch.admin.bit.jeap.openrewrite.recipe.jackson.AddJacksonFailOnNullForPrimitivesToApplicationProperties
  - ch.admin.bit.jeap.openrewrite.recipe.jackson.AddJacksonFailOnNullForPrimitivesToApplicationYaml
  # Spring Boot 4: spring-retry is no longer managed. Spring Framework 7 provides built-in retry
  # via org.springframework.resilience.annotation. Migrates @Retryable, @EnableRetry→@EnableResilientMethods,
  # RetryTemplate, and maxAttempts→maxRetries (value adjusted: maxRetries = maxAttempts - 1).
  # NOTE: @Backoff and @Recover have no direct equivalent — left as-is for manual resolution.
  - ch.admin.bit.jeap.openrewrite.recipe.resilience.MigrateSpringRetryToSpringFramework7
  # If no DB driver and no datasource URL are detected in the project, remove Flyway/Liquibase
  # and replace Spring Data JPA dependencies with Spring Data Commons to avoid DataSource startup failures.
  - ch.admin.bit.jeap.openrewrite.recipe.boot.RemoveDatabaseAutoConfigDependenciesWhenNoDriverOrDatasource
  # Test profile safeguard: add auto-config excludes only when no datasource/r2dbc URL exists.
  - ch.admin.bit.jeap.openrewrite.recipe.boot.AddTestDatasourceAutoConfigExcludesWhenNoDatasourceUrl
  # Spring Kafka 4: Jackson type renames (DefaultKafkaHeaderMapper → JsonKafkaHeaderMapper, etc.)
  - org.openrewrite.java.spring.kafka.UpgradeSpringKafka_4_0
  - org.openrewrite.java.spring.batch.SpringBatch5To6Migration
  - org.openrewrite.java.spring.boot4.SpringBootProperties_4_0
  - org.openrewrite.java.spring.boot4.ReplaceMockBeanAndSpyBean
  # Fallback for cases where ReplaceMockBeanAndSpyBean does not trigger due missing type attribution.
  - ch.admin.bit.jeap.openrewrite.recipe.boot.FallbackMigrateMockBeanToMockitoBean
  - org.openrewrite.hibernate.MigrateToHibernate71
  # Hibernate 7: @Where → @SQLRestriction, @WhereJoinTable → @SQLJoinTableRestriction,
  # and @Loader removed (superseded by @SQLRestriction which now auto-applies during load-by-id).
  # Not covered by the MigrateToHibernate71 recipe above.
  - ch.admin.bit.jeap.openrewrite.recipe.hibernate.MigrateHibernate7RemovedAnnotations
  - org.openrewrite.java.testing.testcontainers.Testcontainers2Migration
  # Testcontainers 2.x removed all shaded packages (org.testcontainers.shaded.*).
  # Strip the shaded prefix so e.g. shaded Apache Commons Lang3 imports use the real package.
  - ch.admin.bit.jeap.openrewrite.recipe.testcontainers.MigrateTestcontainers2ShadedClasses
  # Testcontainers 2.x: module artifacts renamed to include testcontainers- prefix.
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.testcontainers
      oldArtifactId: minio
      newArtifactId: testcontainers-minio
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.testcontainers
      oldArtifactId: postgresql
      newArtifactId: testcontainers-postgresql
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.testcontainers
      oldArtifactId: junit-jupiter
      newArtifactId: testcontainers-junit-jupiter
  - ch.admin.bit.jeap.openrewrite.recipe.testcontainers.MigrateTestcontainersArtifacts
  # Add test-scoped Testcontainers module dependencies based on imports (incl. junit-jupiter, minio, etc.).
  - ch.admin.bit.jeap.openrewrite.recipe.springboot.test.AddTestcontainersDeps
  - org.openrewrite.java.springdoc.UpgradeSpringDoc_3_0
  - org.openrewrite.java.spring.boot4.MigrateToModularStarters
  # Spring Boot 4 modular test starters: MigrateToModularStarters uses type-resolution-based onlyIfUsing
  # which fails when the old SB3 types are gone from the classpath (after parent upgrade to SB4).
  # This text-based ScanningRecipe correctly detects @DataJpaTest/@AutoConfigureTestDatabase usages
  # in both SB3 and SB4 package names, and adds spring-boot-starter-data-jpa-test (test scope).
  - ch.admin.bit.jeap.openrewrite.recipe.springboot.test.AddDataJpaTestStarterDep
  # Spring Boot 4 modular test starters: add Web MVC test starter when @AutoConfigureMockMvc is used.
  - ch.admin.bit.jeap.openrewrite.recipe.springboot.test.AddWebMvcTestStarterDep
  # Spring Boot 4 modular test starters: split observability test annotations into separate test starters.
  - ch.admin.bit.jeap.openrewrite.recipe.springboot.test.AddSpringBootObservabilityTestDeps
  # Spring Boot 4 modular starter split: FlywayProperties now lives in spring-boot-flyway.
  - ch.admin.bit.jeap.openrewrite.recipe.springboot.test.AddSpringBootFlywayModuleDep
  # Detect outbox schema drift and generate additive Flyway migration when deferred_message.sampled is missing.
  - ch.admin.bit.jeap.openrewrite.recipe.flyway.AddMissingOutboxColumnMigration:
      tableName: deferred_message
      columnName: sampled
      sqlType: BOOLEAN
      defaultExpression: FALSE
      migrationDescriptionSuffix: add_deferred_message_sampled_column
      dependencyMatchers: ch.admin.bit.jeap:*outbox*,ch.admin.bit.jeap:*db-migration*,ch.admin.bit.jeap:jeap-messaging-*,org.springframework.integration:spring-integration-jdbc,org.flywaydb:flyway-core
      migrationRoots: src/main/resources/db/migration
  # Spring Boot 4: Add spring-boot-starter-cache if @EnableCaching is used
  - ch.admin.bit.jeap.openrewrite.recipe.springboot.AddSpringBootStarterCache
  # Spring Boot 4: Normalize ObjectMapper configuration to use Jackson2ObjectMapperBuilderCustomizer
  # Hibernate 7.1 / Spring Boot 4.0: Migrate Hypersistence Utils
  - ch.admin.bit.jeap.openrewrite.recipe.maven.MigrateHypersistenceUtils
  # Align Logbook version property used by projects
  - ch.admin.bit.jeap.openrewrite.recipe.maven.UpdateLogbookVersionProperty
  - ch.admin.bit.jeap.openrewrite.recipe.boot.NormalizeObjectMapperConfiguration
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: 4.0.x
      overrideManagedVersion: false
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-dependencies
      newVersion: 4.0.x
      overrideManagedVersion: true
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-maven-plugin
      newVersion: 4.0.x
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 4.0.x
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: org.springframework.boot
      newVersion: 4.0.x
  - org.openrewrite.gradle.UpdateGradleWrapper:
      version: ^8.14
      addIfMissing: false

  # Replace deprecated starters with their new names
  # https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#deprecated-starters
  # Rename without pinning version when dependency-management plugin manages versions via BOM
  - org.openrewrite.java.spring.boot4.RenameDeprecatedStartersManagedVersions
  # Fallback: rename with explicit version for modules without the plugin
  # (no-op where the managed-version variant already renamed the artifact)
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-authorization-server
      newArtifactId: spring-boot-starter-security-oauth2-authorization-server
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-client
      newArtifactId: spring-boot-starter-security-oauth2-client
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-resource-server
      newArtifactId: spring-boot-starter-security-oauth2-resource-server
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-web
      newArtifactId: spring-boot-starter-webmvc
      newVersion: 4.0.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-web-services
      newArtifactId: spring-boot-starter-webservices
      newVersion: 4.0.x
  # https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#aop-starter-pom
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-aop
      unlessUsing: org.aspectj.lang.annotation.*
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-aop
      newArtifactId: spring-boot-starter-aspectj
      newVersion: 4.0.x

  # Additional dependencies that need to move in sync
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: eu.michael-simons.neo4j
      artifactId: neo4j-migrations-spring-boot-starter
      newVersion: 3.0.x
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.github.wimdeblauwe
      artifactId: error-handling-spring-boot-starter
      newVersion: 5.0.x
      overrideManagedVersion: true

  - org.openrewrite.java.spring.boot4.AddAutoConfigureTestRestTemplate
  - org.openrewrite.java.spring.boot4.AddAutoConfigureWebTestClient

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.boot4.RenameDeprecatedStartersManagedVersions
displayName: Rename Spring Boot 4.0 starters with managed versions
description: >-
  Renames deprecated Spring Boot starters to their new names without adding explicit versions,
  for use in projects where the `io.spring.dependency-management` plugin manages versions via BOM.
preconditions:
  - org.openrewrite.gradle.search.ModuleHasPlugin:
      pluginId: io.spring.dependency-management
recipeList:
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-authorization-server
      newArtifactId: spring-boot-starter-security-oauth2-authorization-server
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-client
      newArtifactId: spring-boot-starter-security-oauth2-client
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-oauth2-resource-server
      newArtifactId: spring-boot-starter-security-oauth2-resource-server
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-web
      newArtifactId: spring-boot-starter-webmvc
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-web-services
      newArtifactId: spring-boot-starter-webservices
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.boot
      oldArtifactId: spring-boot-starter-aop
      newArtifactId: spring-boot-starter-aspectj

---
type: specs.openrewrite.org/v1beta/recipe
name: ch.admin.bit.jeap.openrewrite.recipe.jackson.AddJacksonFailOnNullForPrimitivesToApplicationProperties
displayName: Add FAIL_ON_NULL_FOR_PRIMITIVES=false to application.properties
description: >-
  Jackson 3 changed FAIL_ON_NULL_FOR_PRIMITIVES default to true. This recipe adds
  spring.jackson.deserialization.fail-on-null-for-primitives=false to application.properties
  only (not profile-specific files) to restore the Jackson 2.x default behavior.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/application.properties"
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: spring.jackson.deserialization.fail-on-null-for-primitives
      value: "false"
      comment: "TODO: Jackson 3 changed FAIL_ON_NULL_FOR_PRIMITIVES default to true - evaluate if you want stricter null-for-primitives validation"

---
type: specs.openrewrite.org/v1beta/recipe
name: ch.admin.bit.jeap.openrewrite.recipe.jackson.AddJacksonFailOnNullForPrimitivesToApplicationYaml
displayName: Add FAIL_ON_NULL_FOR_PRIMITIVES=false to application.yml
description: >-
  Jackson 3 changed FAIL_ON_NULL_FOR_PRIMITIVES default to true. This recipe adds
  spring.jackson.deserialization.fail-on-null-for-primitives=false to application.yml
  only (not profile-specific files) to restore the Jackson 2.x default behavior.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/application.yml"
recipeList:
  - org.openrewrite.yaml.MergeYaml:
      key: "$"
      yaml: |
        spring:
          jackson:
            deserialization:
              # TODO: Jackson 3 changed FAIL_ON_NULL_FOR_PRIMITIVES default to true - evaluate if you want stricter null-for-primitives validation
              fail-on-null-for-primitives: false
      acceptTheirs: true
